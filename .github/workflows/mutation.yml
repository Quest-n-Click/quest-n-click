name: mutation
# One mutation set on one ref, started by hand (4.1.17): `gh workflow run mutation --ref main -f set=remix -f ref=<branch
# or SHA> [-f file=<path>]`. The survivors of a set being read (plan §9) are measured on a runner, not on a laptop for
# hours; the report is kept as the run's artifact. It gates nothing: the gated sets run in ci, the nightly, the
# candidate and the release.
on:
  workflow_dispatch:
    inputs:
      set:
        description: 'The set (gated: core, reality, runs, remix, speedrun, connectors-pure, reality-store; measured: connectors-edge, reality-store-postgres)'
        required: true
      ref:
        description: 'The branch or SHA to measure'
        required: true
      file:
        description: 'One file of the set only (optional)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # A Postgres for the set whose tests need one (reality-store-postgres, 4.1.19). Its URL is given to that set only
    # (below): with it, other sets' tests would also run their Postgres cases, and judge mutants otherwise than the gate.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge
          POSTGRES_DB: bridge
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U bridge" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - shell: bash
        env:
          SET: ${{ github.event.inputs.set }}
          BRIDGE_PG_URL: ${{ github.event.inputs.set == 'reality-store-postgres' && 'postgres://bridge:bridge@127.0.0.1:5432/bridge' || '' }}
          FILE: ${{ github.event.inputs.file }}
        run: npx tsx tools/mutate.ts --set="$SET" --fresh ${FILE:+--file="$FILE"} | tee mutation.txt
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-${{ github.event.inputs.set }}
          path: |
            mutation.txt
            .cache/mutation/report-*.json
          include-hidden-files: true
          if-no-files-found: ignore
